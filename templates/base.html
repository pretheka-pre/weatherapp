<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}SkyCast{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Website Icon -->
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='images/icon.png') }}?v=1">

</head>
  <body>
    <div class="page-shell">
      {% block content %}{% endblock %}
    </div>

    <footer class="footer">
      <p>SkyCast © 2026 · Live forecasts powered by Open-Meteo and Nominatim</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');
        const spinner = document.getElementById('loadingSpinner');
        const button = document.getElementById('submitBtn');

        if (form && spinner && button) {
          form.addEventListener('submit', function () {
            spinner.classList.remove('d-none');
            button.disabled = true;
            button.innerHTML = '<span class="me-2">⏳</span>Fetching...';
          });
        }
      });
    </script>
  </body>
</html>
